<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAGE Demo</title>
  <meta name="description" content="SAGE: Data-Semantics-Aware Recommendation of Diverse Pivot Tables — interactive demo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23ff4b4b%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-family=%27Arial%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27white%27%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>SAGE</h1>
      <p>Data-Semantics-Aware Recommendation of Diverse Pivot Tables</p>
    </div>
    <div class="topbar-right">
      <div class="dataset-chip">Demo · results are precomputed examples</div>
      <div class="guide-switch-wrap">
        <label class="switch">
          <input type="checkbox" id="guide-toggle" role="switch">
          <span class="track" aria-hidden="true"></span>
          <span>Guide mode</span>
        </label>
        <div class="guide-hint" id="guide-hint" hidden>
          <button type="button" class="guide-hint-text" id="guide-hint-on">👋 New here? <b>Click here for guide mode</b></button>
          <button type="button" class="guide-hint-close" id="guide-hint-close" aria-label="Dismiss">×</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="preview-band">
      <div class="preview-card" id="preview"></div>
    </section>

    <section class="grid">
      <!-- Parameters -->
      <div class="col col-params">
        <div class="panel panel-params">
          <h2>Parameters</h2>
          <p class="lock-note">🔒 Fixed in this demo<button type="button" class="guide-dot" data-tip="locked" aria-label="What is this?">?</button></p>

          <div class="field-label"><label for="diversity-input">Diversity (%)</label><button type="button" class="guide-dot" data-tip="diversity" aria-label="What is this?">?</button></div>
          <input type="text" class="param-value" id="diversity-input" value="30" disabled>

          <div class="field-label"><label for="num-input">Number of tables</label><button type="button" class="guide-dot" data-tip="numTables" aria-label="What is this?">?</button></div>
          <input type="text" class="param-value" id="num-input" value="5" disabled>

          <div class="field-label"><span id="attr-label">Preferred attributes</span><button type="button" class="guide-dot" data-tip="attributes" aria-label="What is this?">?</button></div>
          <ul class="param-value param-tags" aria-labelledby="attr-label">
            <li>City</li><li>Cuisines</li><li>Rating</li>
          </ul>
        </div>

        <div class="panel panel-action">
          <button type="button" class="btn-primary" id="recommend-btn">Recommend</button>
          <button type="button" class="guide-dot" data-tip="recommend" aria-label="What is this?">?</button>
        </div>
      </div>

      <!-- Recommendation list -->
      <div class="col">
        <div class="panel panel-tall" id="rec-list"></div>
      </div>

      <!-- Visualization -->
      <div class="col">
        <div class="panel panel-tall" id="detail"></div>
      </div>

      <!-- User preferences -->
      <div class="col">
        <div class="panel panel-tall" id="prefs"></div>
      </div>
    </section>
  </main>

  <div class="guide-pop" id="guide-pop" role="tooltip" hidden></div>
  <div class="coach" id="guide-coach" role="status" hidden>
    <div class="coach-step" id="coach-step"></div>
    <div class="coach-text" id="coach-text"></div>
    <button type="button" class="coach-next" id="coach-next" hidden>Next →</button>
    <button type="button" class="coach-close" id="coach-close" aria-label="Hide this tip">×</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
